name: Supabase Markdown Sync

on:
  workflow_dispatch:
    inputs:
      max_delete_ratio:
        description: "Largest share of existing files the sync may delete (raise only after checking the CMS)"
        default: "0.02"
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: supabase-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest scripts.test_sync

      - name: Run sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python scripts/sync.py --full \
            --max-delete-ratio "${{ inputs.max_delete_ratio || '0.02' }}" \
            --summary-file "$RUNNER_TEMP/sync-summary.json"

      # score_fields_labelled stays ignored until the schema-v2 export (docs/improvements/03-schema-v2.md).
      - name: Audit
        run: python scripts/audit.py --strict --ignore score_fields_labelled

      - name: Commit and push changes
        run: |
          if [ -z "$(git status --porcelain content indexes)" ]; then
            echo "No changes"
            exit 0
          fi

          counts=$(python -c 'import json,sys; s=json.load(open(sys.argv[1])); print(", ".join(f"{k} {s[k]}" for k in ("created","updated","deleted","unchanged")))' "$RUNNER_TEMP/sync-summary.json")

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content indexes
          git commit -m "chore(sync): CMS snapshot $(date -u +%F)" -m "$counts"
          git push

      - name: Close "Sync failing" issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for n in $(gh issue list --state open --search 'in:title "Sync failing"' --json number -q '.[].number'); do
            gh issue close "$n" --comment "Sync succeeded: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          done

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          n=$(gh issue list --state open --search 'in:title "Sync failing"' --json number -q '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "Failed again: $url"
          else
            gh issue create --title "Sync failing" --body "The scheduled CMS sync failed and pushed nothing: $url"
          fi
