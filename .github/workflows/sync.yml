name: Supabase Markdown Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL_CMS: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL_CMS }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY_CMS: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY_CMS }}
        run: python scripts/sync.py --full

      - name: Commit and push changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content indexes
          git commit -m "chore(sync): supabase -> markdown snapshot"
          git push
